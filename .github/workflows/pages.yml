name: pages

# Publish the Offer Advisor (the single-house analyser) to GitHub Pages.
#
# WHAT SHIPS
# ----------
#   index.html + engine.js + data.js   — the analyser, ~0.6 MB, from PUBLIC-RECORD
#                                        sold data. Does not rot.
#   market.html + listings.js          — the live-market browser, ~1.4 MB. Published
#                                        deliberately (owner's call, 2026-07-17).
#   map.html + map.js                  — the town-metrics map (Leaflet+OSM/CARTO tiles,
#                                        FEMA flood tiles). ~143 KB data. Public record.
#   sold.html + sold.js                — every closed sale, ~3.9 MB raw / ~1.0 MB gzipped.
#                                        Public record; unlike the market it cannot rot.
#
# TWO THINGS TO KEEP IN VIEW NOW THAT THE MARKET BROWSER IS PUBLIC
# ---------------------------------------------------------------
# 1. It republishes ~3,500 Realtor.com listings and HOTLINKS their photos from
#    rdcpix.com — their bandwidth serving our page. Realtor 403s datacenter IPs
#    specifically to discourage redistribution. This is a terms-of-service question,
#    not a technical one; it is the owner's to make and it has been made. To reverse
#    it, drop market.html/listings.js from the copy step below and re-run.
# 2. IT ROTS ~2%/DAY and a URL implies "live" in a way a local file never does. The
#    page carries a staleness stamp that goes amber past 3 days — that stamp is now
#    load-bearing, not decoration. Do not remove it.
#
# WHY THE LISTINGS CANNOT BE REFRESHED HERE
# -----------------------------------------
# `listing_scrape` 403s datacenter IPs, so NO GitHub runner can fetch listings — only
# a residential connection can (market-history/CLAUDE.md). CI rebuilds listings.js
# from the COMMITTED listings.csv, so the published market is exactly as fresh as the
# last `python3 listings.py` run someone pushed. There is no way to automate that.
#
# Both .js files are re-baked here from the committed CSVs rather than trusted from
# the repo, so a stale commit can never publish numbers that disagree with the data
# behind them. (listings.js is gitignored — it is a 1.4 MB build artifact.)

on:
  push:
    branches: [main]
    paths:
      - 'market-history/offer/**'
      - 'market-history/share/**'
      - 'market-history/analysis/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a half-finished deploy; queue instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Re-bake data.js from the committed CSVs
        working-directory: market-history
        # stdlib only — no pip install, nothing to pin.
        # OFFER_DEPLOY marks this as the published copy, so index.html hides its link
        # to the live-market browser — which is not deployed and would 404 here.
        run: python3 offer/build_data.py

      - name: Assemble the site
        run: |
          mkdir -p _site
          cp market-history/offer/index.html    _site/
          cp market-history/offer/analyser.html _site/
          cp market-history/offer/market.html   _site/
          cp market-history/offer/engine.js    _site/
          cp market-history/offer/data.js      _site/
          cp market-history/offer/listings.js  _site/
          cp market-history/offer/sold.html    _site/
          cp market-history/offer/sold.js      _site/
          cp market-history/offer/map.html     _site/
          cp market-history/offer/map.js       _site/
          cp market-history/offer/backtest.html _site/
          # Not optional: market/sold/backtest all call presetMatch() while drawing the
          # town picker, so a missing towns-groups.js is a ReferenceError that takes the
          # whole picker down, not a chip row that quietly fails to appear.
          cp market-history/offer/towns-groups.js _site/
          cp market-history/layers/flood/flood_zones.geojson _site/flood.geojson
          # The market browser is only honest if it says how old it is — a stale
          # snapshot on a public URL is worse than no snapshot. Fail rather than
          # publish a page that lost its staleness stamp.
          grep -q 'id="stamp"' _site/market.html || {
            echo "::error::market.html has no staleness stamp — refusing to publish a live-market page that cannot say how old it is."
            exit 1
          }
          echo "published:"; ls -la _site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
