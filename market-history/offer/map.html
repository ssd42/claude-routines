<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Map — NJ market history</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="anonymous">
<style>
  :root{
    --paper:#f7f4ee; --paper-2:#f1ece3; --rule:#ddd5c7; --rule-2:#c8bda9;
    --ink:#1f1c18; --ink-2:#544d43; --ink-3:#8a8072;
    --over:#8c2f2a; --under:#2c6459; --flag:#a8631c;
    --serif:"Iowan Old Style","Hoefler Text","Baskerville","Palatino Linotype",Georgia,serif;
    --sans:"Avenir Next","Seravek","Optima","Gill Sans",Helvetica,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:var(--sans);color:var(--ink);background:var(--paper);
    -webkit-font-smoothing:antialiased;overflow:hidden}
  #map{position:absolute;inset:0;background:var(--paper-2)}
  .leaflet-container{font-family:var(--sans)}

  /* ── top bar: title + metric switcher ── */
  .bar{position:absolute;top:0;left:0;right:0;z-index:1000;background:color-mix(in oklab,var(--paper) 92%,transparent);
    backdrop-filter:blur(6px);border-bottom:1px solid var(--rule);padding:.5rem .7rem;
    display:flex;flex-direction:column;gap:.45rem}
  .row1{display:flex;align-items:baseline;gap:.6rem}
  h1{font-family:var(--serif);font-weight:400;font-size:1.15rem;letter-spacing:-.01em}
  h1 em{font-style:italic;color:var(--ink-2)}
  .nav{margin-left:auto;display:flex;gap:.7rem}
  .nav a{font-size:.72rem;color:var(--ink-3);text-decoration:none;border-bottom:1px solid var(--rule-2)}
  .nav a:hover{color:var(--ink)}
  .metrics{display:flex;gap:.3rem;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:.1rem}
  .metrics button{flex:none;background:transparent;border:1px solid var(--rule-2);color:var(--ink-3);
    font-family:var(--sans);font-size:.75rem;padding:.35rem .6rem;cursor:pointer;white-space:nowrap;border-radius:2px}
  .metrics button.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
  @media (pointer:coarse){.metrics button{padding:.5rem .8rem;font-size:.8rem}}

  /* ── toggles + locate (bottom-left, thumb-reachable) ── */
  .tools{position:absolute;left:.6rem;bottom:.9rem;z-index:1000;display:flex;flex-direction:column;gap:.4rem}
  .tools button{background:var(--paper);border:1px solid var(--rule-2);color:var(--ink-2);
    font-family:var(--sans);font-size:.75rem;padding:.5rem .7rem;cursor:pointer;border-radius:2px;
    box-shadow:0 2px 8px -4px rgba(31,28,24,.4);text-align:left;white-space:nowrap}
  .tools button.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
  #locate{font-weight:600}
  @media (pointer:coarse){.tools button{padding:.7rem .9rem;font-size:.85rem}}

  /* ── filter panel (pops over the tools when open) ── */
  .fpanel{position:absolute;left:.6rem;bottom:.9rem;z-index:1001;background:var(--paper);
    border:1px solid var(--ink);border-radius:2px;padding:.7rem;width:12rem;
    box-shadow:0 4px 16px -6px rgba(31,28,24,.5);display:none;flex-direction:column;gap:.45rem}
  .fpanel.on{display:flex}
  .fpanel .fhead{display:flex;align-items:center;justify-content:space-between}
  .fpanel h4{font-size:.66rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
  .fpanel .fx{background:none;border:0;font-size:1.2rem;line-height:1;color:var(--ink-3);cursor:pointer;padding:0 .1rem}
  .fpanel label{font-size:.74rem;color:var(--ink-2);display:flex;justify-content:space-between;align-items:center;gap:.5rem}
  .fpanel input{width:5.6rem;font-family:var(--sans);font-size:.82rem;padding:.3rem .4rem;
    border:1px solid var(--rule-2);border-radius:2px;background:#fff;color:var(--ink)}
  .fpanel .fbtns{display:flex;gap:.4rem;margin-top:.15rem}
  .fpanel .fbtns button{flex:1;font-family:var(--sans);font-size:.78rem;padding:.45rem;cursor:pointer;
    border:1px solid var(--rule-2);border-radius:2px;background:var(--paper);color:var(--ink-2)}
  .fpanel .fbtns #f-apply{background:var(--ink);color:var(--paper);border-color:var(--ink)}

  /* ── legend (bottom-right) ── */
  .legend{position:absolute;right:.6rem;bottom:.9rem;z-index:1000;background:var(--paper);
    border:1px solid var(--rule);border-radius:2px;padding:.55rem .65rem;max-width:14rem;
    box-shadow:0 2px 8px -4px rgba(31,28,24,.4);font-size:.72rem}
  .legend h4{font-size:.66rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-bottom:.35rem}
  .legend .ramp{height:.5rem;border-radius:2px;margin:.2rem 0}
  .legend .ends{display:flex;justify-content:space-between;color:var(--ink-3);font-variant-numeric:tabular-nums}
  .legend .cav{margin-top:.4rem;color:var(--ink-3);line-height:1.4;font-style:italic}
  .legend .swatches{display:flex;flex-direction:column;gap:.15rem}
  .legend .sw{display:flex;align-items:center;gap:.4rem}
  .legend .sw i{width:.85rem;height:.85rem;border-radius:2px;display:inline-block}

  /* ── town card (bottom sheet) ── */
  .card{position:absolute;left:0;right:0;bottom:0;z-index:1100;background:var(--paper);
    border-top:2px solid var(--ink);padding:.9rem 1rem 1.1rem;transform:translateY(110%);
    transition:transform .22s cubic-bezier(.22,1,.36,1);box-shadow:0 -8px 24px -18px rgba(31,28,24,.6);
    max-height:60vh;overflow:auto}
  .card.on{transform:none}
  .card .x{position:absolute;top:.6rem;right:.8rem;background:none;border:0;font-size:1.3rem;
    color:var(--ink-3);cursor:pointer;line-height:1}
  .card h2{font-family:var(--serif);font-weight:400;font-size:1.5rem;letter-spacing:-.01em}
  .card .sub{font-size:.78rem;color:var(--ink-3);margin-bottom:.7rem}
  .card .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(7rem,1fr));gap:.6rem 1rem}
  .card .m{border-left:2px solid var(--rule);padding-left:.5rem}
  .card .m .k{font-size:.62rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
  .card .m .v{font-family:var(--serif);font-size:1.15rem;font-variant-numeric:tabular-nums}
  .card .m .c{font-size:.66rem;color:var(--rule-2);font-style:italic}
  .card .also{margin-top:.7rem;font-size:.74rem;color:var(--ink-2)}
  .card .also a{color:var(--over);text-decoration:none;border-bottom:1px solid var(--rule-2)}

  .stamp{position:absolute;top:4.6rem;right:.6rem;z-index:900;font-size:.66rem;color:var(--ink-3);
    background:color-mix(in oklab,var(--paper) 85%,transparent);padding:.2rem .45rem;border-radius:2px}
  .pop-addr{font-size:.82rem;color:var(--ink-2);margin:.15rem 0 .1rem}

  /* ── phone tuning ── */
  @media (max-width:480px){
    h1{font-size:1rem}
    .nav{gap:.5rem}
    .nav a{font-size:.66rem}
    /* fade the right edge of the metric strip so it reads as "scroll for more"
       (Commute / Property tax / My tier live off-screen otherwise) */
    .metrics{-webkit-mask-image:linear-gradient(90deg,#000 88%,transparent);
             mask-image:linear-gradient(90deg,#000 88%,transparent)}
    /* the stamp was hidden behind the (taller, 2-row) bar — drop it just below */
    .stamp{top:5.9rem}
    /* narrow the legend + collapse its caveat behind a tap, so it stops colliding with
       the bottom-left tools. Swatches (the part you glance at) stay visible; tap to read
       the caveat. */
    .legend{max-width:10.5rem}
    .legend h4{cursor:pointer}
    .legend h4::after{content:" ⓘ";color:var(--rule-2)}
    .legend .cav{display:none}
    .legend.show-cav .cav{display:block}
    .legend.show-cav h4::after{content:" ×"}
    /* 16px stops iOS Safari from auto-zooming the page when a filter field is focused */
    .fpanel input{font-size:16px}
  }
</style>
</head>
<body>
<div id="map"></div>

<div class="bar">
  <div class="row1">
    <h1>NJ map <em>— by the numbers</em></h1>
    <nav class="nav"><a href="sold.html">sold</a><a href="market.html">market</a><a href="index.html">price a house</a></nav>
  </div>
  <div class="metrics" id="metrics"></div>
</div>

<div class="stamp" id="stamp"></div>

<div class="tools">
  <button id="locate">◎ Where am I</button>
  <button id="toggle-flood">Flood zones (FEMA)</button>
  <button id="toggle-points">For-sale houses</button>
  <button id="toggle-filter">⚑ Filter houses</button>
</div>

<div class="fpanel" id="filter-panel">
  <div class="fhead"><h4>Filter houses</h4><button id="f-close" class="fx" aria-label="close">×</button></div>
  <label>Min price <input id="f-minp" type="number" inputmode="numeric" placeholder="any"></label>
  <label>Max price <input id="f-maxp" type="number" inputmode="numeric" placeholder="any"></label>
  <label>Min beds <input id="f-minbd" type="number" inputmode="numeric" placeholder="any"></label>
  <label>Min baths <input id="f-minba" type="number" inputmode="numeric" placeholder="any"></label>
  <div class="fbtns"><button id="f-clear">Clear</button><button id="f-apply">Apply</button></div>
</div>

<div class="legend" id="legend"></div>

<div class="card" id="card">
  <button class="x" id="card-x">×</button>
  <h2 id="card-town"></h2>
  <div class="sub" id="card-sub"></div>
  <div class="grid" id="card-grid"></div>
  <div class="also" id="card-also"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="anonymous"></script>
<!-- ?v bumps with BUILD below so a new deploy always fetches fresh data, never a cached
     map.js against new map.html (that mismatch showed pins with "? bd" and no link). -->
<!-- Load the data with a per-load cache-buster (rounded to 5 min). GitHub Pages caches THIS
     html ~10 min, and a cached html used to keep pulling a stale map.js — showing old
     appreciation. This inline document.write runs on every page load even from a cached html,
     so the DATA is never more than ~5 min stale regardless of the html cache. -->
<script>document.write('<scr'+'ipt src="map.js?t='+Math.floor(Date.now()/3e5)+'"></scr'+'ipt>');</script>
<script>
"use strict";
const M = window.MAP;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&"'<>]/g, c=>({"&":"&amp;",'"':"&quot;","'":"&#39;","<":"&lt;",">":"&gt;"}[c]));
const usd = n => n == null ? "—" : "$" + Math.round(n).toLocaleString("en-US");
const usdK = n => n == null ? "—" : n>=1e6 ? "$"+(n/1e6).toFixed(2).replace(/0$/,"")+"M" : "$"+Math.round(n/1e3)+"K";

/* ── the metrics, each with its scale, direction, formatter, and the caveat it must carry ──
   These caveats are hard-won elsewhere in the project. On a map, colour is more persuasive
   than a flagged table, so the caveat rides in the legend, always. */
const METRICS = {
  appr:    {label:"Appreciation", fmt:v=>v==null?"—":"+"+v+"%", scheme:"greens",
            cav:"CONSENSUS of Zillow ZHVI + FHFA HPI — two independent mix-controlled indexes, averaged. ~3yr TOTAL (not year-over-year), town-specific by ZIP. Our own sold data was too mix-noisy to use directly."},
  price:   {label:"Median price", fmt:usdK, scheme:"purples",
            cav:"Median SOLD price. A town median hides the spread — the per-house pages show that."},
  school:  {label:"Schools", fmt:v=>v==null?"—":v.toFixed(1)+"/10", scheme:"blues",
            cav:"NJ DOE district decile. A DISTRICT proxy — two houses on a street can feed different schools."},
  income:  {label:"Income", fmt:usdK, scheme:"oranges",
            cav:"ACS median household income, ±$15–25k margins. An AREA statistic, never a quality ranking."},
  commute: {label:"Commute", fmt:v=>v==null?"—":v+" min", scheme:"reds",
            cav:"AM-peak to Manhattan. Town-level; excludes drive to the station where there's none."},
  tax:     {label:"Property tax", fmt:usdK, scheme:"browns",
            cav:"AVG residential tax BILL (NJ DCA 2025). Tracks home value, so a pricey town looks high even at a low rate — the town card shows the effective RATE, which is the fairer town-to-town compare."},
  tier:    {label:"My tier", cat:true,
            cats:{S:"#2c6459",A:"#5a8a6f",B:"#c8bda9",C:"#c99a5b",D:"#a8631c",F:"#8c2f2a"},
            fmt:v=>v||"—", cav:"Hand-ranked preference, not data. The one opinion on the map."},
};
let metric = "appr";

/* Each metric gets its OWN single-hue sequential palette, classed into 5 bins — so the
   towns fall into a few clearly-different colours instead of one near-uniform gradient.
   Dark = HIGH value, always (no good/bad inversion; the legend names the metric). Bins are
   DATA QUANTILES (quintiles), so every colour holds roughly a fifth of the towns — that's
   what makes the differences legible. Distinct hues also mean you can tell at a glance which
   metric you're on. ColorBrewer sequential ramps (colour-blind-safe), but starting one
   step IN: ColorBrewer's palest class (e.g. #eff3ff) is tuned for white PAPER and washes
   out to nothing over the light-grey CARTO basemap at 62% fill — the lowest quintile
   looked see-through. These floors are the 2nd class of each 6-class ramp, so the bottom
   bin keeps a legible tint while the ramp still runs light→dark. */
const SCHEMES = {
  greens: ["#c7e9c0","#a1d99b","#74c476","#31a354","#006d2c"],
  purples:["#dadaeb","#bcbddc","#9e9ac8","#756bb1","#54278f"],
  blues:  ["#c6dbef","#9ecae1","#6baed6","#3182bd","#08519c"],
  oranges:["#fdd0a2","#fdae6b","#fd8d3c","#e6550d","#a63603"],
  reds:   ["#fcbba1","#fc9272","#fb6a4a","#de2d26","#a50f15"],
  browns: ["#e9d8a6","#dfc27d","#bf812d","#8c510a","#543005"],
};
const NODATA = "rgba(180,170,155,.22)";                 // unknown = faint grey
const ESTIMATE = "#cdc4b4";                             // borrowed regional est. (not measured) = flat grey
/* Break a metric into up to 5 classes at quantiles OF THE DISTINCT values (not the raw
   values). Appreciation has 43 towns sharing ONE regional estimate; raw-value quantiles
   would collapse every break onto that single number (a legend of "+16.6% – +16.6%").
   Distinct-value quantiles spread the breaks across the real range, so measured outliers
   keep their own colour and the shared-value mass sits in one bin. Ties are de-duped, which
   naturally drops a metric to fewer classes when it truly has fewer distinct levels. */
function makeBins(vals){
  const uniq = [...new Set(vals.filter(v=>v!=null))].sort((a,b)=>a-b);
  if (uniq.length <= 1) return {breaks:[], n:1};
  const k = Math.min(5, uniq.length);
  const brk = [];
  for (let i=1;i<k;i++) brk.push(uniq[Math.round(i*(uniq.length-1)/k)]);
  const breaks = [...new Set(brk)].sort((a,b)=>a-b);
  return {breaks, n:breaks.length+1};
}
// n colours sampled evenly from a scheme, so a 3-class metric uses light/mid/dark
function schemeColors(scheme, n){
  const c = SCHEMES[scheme];
  if (n >= c.length) return c;
  if (n <= 1) return [c[c.length-1]];
  return Array.from({length:n}, (_,i)=> c[Math.round(i*(c.length-1)/(n-1))]);
}
function classOf(v, breaks){ let i=0; while(i<breaks.length && v>=breaks[i]) i++; return i; }
for (const k in METRICS){
  const m = METRICS[k]; if (m.cat) continue;
  const bins = makeBins(Object.values(M.metrics).map(d=>d[k]));
  m._breaks = bins.breaks;
  m._colors = schemeColors(m.scheme, bins.n);
}
function colorFor(town){
  const m = METRICS[metric], d = M.metrics[town], v = d ? d[metric] : null;
  if (v == null) return NODATA;
  if (m.cat) return m.cats[v] || NODATA;
  // appreciation is MEASURED for only 20 towns; the rest borrow one regional average. Don't
  // paint a borrowed guess as if it were a town-specific measurement — grey it out instead.
  if (metric === "appr" && d && d.apprMeasured === false) return ESTIMATE;
  return m._colors[classOf(v, m._breaks)];
}

// ── the map ──
const map = L.map("map", {zoomControl:false, attributionControl:true}).setView([40.75,-74.45], 10);
L.control.zoom({position:"topleft"}).addTo(map);
map.createPane("pins");                 // above the choropleth (overlayPane=400)
map.getPane("pins").style.zIndex = 620; // below marker/tooltip panes, above polygons
L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png", {
  attribution:'© OpenStreetMap © CARTO', subdomains:"abcd", maxZoom:19,
}).addTo(map);

// FEMA flood ZONES (toggle) — real SFHA polygons we fetched from FEMA (layers/flood/
// fetch_flood_polygons.py), drawn by US at every zoom. FEMA's own tile layer is scale-
// suppressed (only draws past ~z14), so toggling it on a state-wide map did nothing;
// these are always visible. Lazy-loaded (~335 KB gzipped) on first toggle, canvas-
// rendered so 8k polygons stay smooth on a phone. Own pane, above the choropleth fill,
// below the pins.
let floodLayer = null, floodState = "off", floodN = 0;
async function ensureFlood(){
  if (floodLayer || floodState === "loading") return;
  floodState = "loading"; $("toggle-flood").textContent = "Flood — loading…";
  try {
    const r = await fetch("flood.geojson");
    if (!r.ok) throw new Error(r.status);
    const gj = await r.json();
    floodN = (gj.features||[]).length;
    // plain canvas renderer, default overlay pane, non-interactive (never blocks clicks).
    // Added after the choropleth so it stacks on top; pins live in a higher pane still.
    floodLayer = L.geoJSON(gj, {
      renderer: L.canvas({padding:.5}), interactive:false,
      style:{color:"#1e40af", weight:.6, fillColor:"#2563eb", fillOpacity:.5, opacity:.8},
    });
    floodState = "loaded";
  } catch(e){ floodState = "error"; $("toggle-flood").textContent = "Flood — unavailable"; }
}

// ── choropleth ──
let geo = null;
function style(f){
  return {fillColor:colorFor(f.properties.town), fillOpacity:.62, color:"#fff",
          weight:1, opacity:.7};
}
function drawGeo(){
  if (geo) geo.remove();
  geo = L.geoJSON(M.boundaries, {
    style,
    onEachFeature:(f,layer)=>{
      layer.on("click", ()=>showTown(f.properties.town));
      layer.on("mouseover", ()=>layer.setStyle({weight:2.5, color:"#1f1c18"}));
      layer.on("mouseout", ()=>layer.setStyle({weight:1, color:"#fff"}));
    },
  }).addTo(map);
  map.fitBounds(geo.getBounds(), {padding:[20,20]});   // fit to the four corners of all towns
}

// Select a town from a MAP click, resolved by point-in-polygon (townAt). The polygon
// layer above has its own click handler, but it only fires when nothing is layered over
// it — the for-sale-house pins live in a canvas pane ON TOP of the polygons, and a canvas
// swallows the clicks it doesn't land on a dot. Routing selection through the map click
// (which still fires on those "misses") makes towns selectable whether the pins are shown
// or not. A pin's own click has bubblingMouseEvents:false, so it won't reach here.
map.on("click", e => {
  const town = townAt(e.latlng.lat, e.latlng.lng);
  if (town) showTown(town);
});

// ── legend ──
function drawLegend(){
  const m = METRICS[metric], el = $("legend");
  let rows;
  // appreciation carries its own as-of (external Zillow/FHFA layer, refreshed on its own
  // cadence, not by a sales rehydrate) — show it so a stale index is visible.
  const cav = m.cav + (metric==="appr" && M.apprAsof ? ` As of ${M.apprAsof}.` : "");
  if (m.cat){
    rows = Object.entries(m.cats).map(([k,c]) => ({c, lab:k}));
  } else {
    // one swatch per class, labelled with its value range (dark = high, listed high→low)
    const b = m._breaks, cols = m._colors;
    rows = cols.map((c,i) => {
      let lab;
      if (cols.length===1)          lab = "all towns";
      else if (i===0)               lab = "< " + m.fmt(b[0]);
      else if (i===cols.length-1)   lab = "≥ " + m.fmt(b[b.length-1]);
      else                          lab = m.fmt(b[i-1]) + " – " + m.fmt(b[i]);
      return {c, lab};
    }).reverse();   // darkest (highest) on top
  }
  el.innerHTML = `<h4>${m.label}</h4><div class="swatches">` +
    rows.map(r=>`<div class="sw"><i style="background:${r.c}"></i>${r.lab}</div>`).join("") +
    `</div><div class="cav">${cav}</div>`;
}

// ── the town card ──
function showTown(town){
  const d = M.metrics[town]; if (!d) return;
  $("card-town").textContent = town;
  $("card-sub").textContent = `${d.county ? d.county.charAt(0)+d.county.slice(1).toLowerCase()+" County · " : ""}${d.dist!=null?d.dist+" mi from Westfield":""}`;
  const cell = (k,v,c) => `<div class="m"><div class="k">${k}</div><div class="v">${v}</div>${c?`<div class="c">${c}</div>`:""}</div>`;
  $("card-grid").innerHTML =
    cell("Median price", usdK(d.price), d.vsask!=null?(d.vsask>=0?"+":"")+d.vsask+"% vs ask":"") +
    cell("My tier", d.tier||"—", "") +
    cell("Appreciation", d.appr!=null?"+"+d.appr+"%":"—", d.appr!=null?("~"+(Math.pow(1+d.appr/100,1/3)*100-100).toFixed(1)+"%/yr · Zillow+FHFA avg"):"") +
    cell("Schools", d.school!=null?d.school+"/10":"—", "DOE district") +
    cell("Income", usdK(d.income), "ACS, ±wide") +
    cell("Commute", d.commute!=null?d.commute+" min":"—", "AM peak") +
    cell("Property tax", usdK(d.tax),
         d.taxRate!=null ? d.taxRate+"% eff. rate"+(d.taxSection?" · township":"")+" · ~"+usdK(d.taxRate/100*700000)+" on $700K" : "");
  $("card-also").innerHTML = `<a href="sold.html">see ${town} sold homes →</a>`;
  $("card").classList.add("on");
}
$("card-x").addEventListener("click", ()=>$("card").classList.remove("on"));
document.addEventListener("keydown", e=>{ if(e.key==="Escape") $("card").classList.remove("on"); });
// tap the legend (on a phone) to reveal/hide the metric's caveat
$("legend").addEventListener("click", ()=>$("legend").classList.toggle("show-cav"));

// ── metric switcher ──
$("metrics").innerHTML = Object.entries(METRICS).map(([k,m])=>
  `<button data-m="${k}" class="${k===metric?"on":""}">${m.label}</button>`).join("");
$("metrics").addEventListener("click", e=>{
  const b = e.target.closest("button[data-m]"); if (!b) return;
  metric = b.dataset.m;
  document.querySelectorAll("#metrics button").forEach(x=>x.classList.toggle("on", x===b));
  b.scrollIntoView({block:"nearest", inline:"center", behavior:"smooth"});  // pull an off-screen metric into view
  geo.setStyle(style); drawLegend();
});

// ── FEMA flood toggle ──
$("toggle-flood").addEventListener("click", async ()=>{
  if (floodLayer && map.hasLayer(floodLayer)){
    floodLayer.remove(); $("toggle-flood").classList.remove("on");
    $("toggle-flood").textContent = "Flood zones (FEMA)"; return;
  }
  await ensureFlood();
  if (floodLayer){
    floodLayer.addTo(map); floodLayer.bringToFront(); $("toggle-flood").classList.add("on");
    $("toggle-flood").textContent = `Flood zones (${floodN.toLocaleString()})`;
  }
});

// ── for-sale house pins (houses only, lean canvas) + filter ──
let ptLayer = null;
// ONE persistent canvas renderer, reused every render. Creating a fresh L.canvas() per
// render (as this used to) LEAKED a full-map canvas into the "pins" pane on every toggle:
// they stacked up and — sitting above the choropleth — swallowed town clicks, so once you
// had ever shown the pins you could no longer select a town. tolerance:8 widens the tap
// target past the 6px dot so a near-miss still hits the pin, not a fall-through.
const pinsCanvas = L.canvas({pane:"pins", padding:.5, tolerance:8});
const FILT = {minP:null, maxP:null, minBd:null, minBa:null};
function passFilter(price, beds, baths){
  if (FILT.minP  != null && price < FILT.minP)  return false;
  if (FILT.maxP  != null && price > FILT.maxP)  return false;
  if (FILT.minBd != null && (beds  == null || beds  < FILT.minBd)) return false;
  if (FILT.minBa != null && (baths == null || baths < FILT.minBa)) return false;
  return true;
}
function renderPins(){
  if (ptLayer) ptLayer.remove();
  ptLayer = L.layerGroup();
  let n = 0;
  for (const [lat,lon,price,ty,flood,beds,baths,url,addr] of M.points){
    if (!passFilter(price, beds, baths)) continue;
    n++;
    // popup fields (address, property_type, url) are SCRAPED — treat as untrusted. HTML-encode
    // any interpolated text, and only accept an http(s) url before putting it in an href (blocks
    // javascript:/data: schemes). build_data.py drops bad schemes too; this is defence in depth.
    const safeUrl = /^https?:\/\//i.test(url||"") ? esc(url) : "";
    const link = safeUrl ? `<br><a href="${safeUrl}" target="_blank" rel="noopener noreferrer">view listing →</a>` : "";
    const addrLine = addr ? `<div class="pop-addr">${esc(addr)}</div>` : "";
    L.circleMarker([lat,lon], {renderer:pinsCanvas, pane:"pins", radius:6,
      color:"#fff", weight:1.5, fillColor: flood ? "#8c2f2a" : "#2c6459", fillOpacity:.95,
      // don't let a pin click bubble to the map's click handler, or clicking a house would
      // ALSO open the town card underneath it
      bubblingMouseEvents:false})
      .bindPopup(`<b>${usd(price)}</b>${addrLine}<br>${beds!=null?beds+" bd":"? bd"} · ${baths!=null?baths+" ba":"? ba"} · ${esc(ty||"")}${flood?"<br>⚠ flood zone":""}${link}`)
      .addTo(ptLayer);
  }
  ptLayer.addTo(map);
  $("toggle-points").classList.add("on");
  $("toggle-points").textContent = `Houses (${n.toLocaleString()})`;
}
$("toggle-points").addEventListener("click", ()=>{
  if (ptLayer){ ptLayer.remove(); ptLayer=null; $("toggle-points").classList.remove("on");
    $("toggle-points").textContent = "For-sale houses"; return; }
  renderPins();
});

// ── filter panel ──
function closeFilter(){ $("filter-panel").classList.remove("on"); $("toggle-filter").classList.remove("on"); }
$("toggle-filter").addEventListener("click", ()=>{
  const open = $("filter-panel").classList.toggle("on");
  $("toggle-filter").classList.toggle("on", open);
});
// the panel covers the toggle button, so it needs its own close (× in the header)
$("f-close").addEventListener("click", closeFilter);
const numOrNull = el => { const v = parseFloat(el.value); return isFinite(v) ? v : null; };
$("f-apply").addEventListener("click", ()=>{
  FILT.minP  = numOrNull($("f-minp"));   FILT.maxP  = numOrNull($("f-maxp"));
  FILT.minBd = numOrNull($("f-minbd"));  FILT.minBa = numOrNull($("f-minba"));
  renderPins();                                   // turns pins on (or refreshes) with the filter
  $("filter-panel").classList.remove("on"); $("toggle-filter").classList.remove("on");
  const active = Object.values(FILT).some(v=>v!=null);
  $("toggle-filter").textContent = active ? "⚑ Filter (on)" : "⚑ Filter houses";
});
$("f-clear").addEventListener("click", ()=>{
  ["f-minp","f-maxp","f-minbd","f-minba"].forEach(id=>$(id).value="");
  FILT.minP=FILT.maxP=FILT.minBd=FILT.minBa=null;
  $("toggle-filter").textContent = "⚑ Filter houses";
  if (ptLayer) renderPins();
});

/* ── "Where am I" — point-in-polygon, NOT nearest centroid ──────────────────────────────
   Ray-casting against the baked boundaries. CDPs (the section polygons: Short Hills,
   Colonia...) are tested FIRST because a CDP sits inside a township — a point in Short
   Hills must resolve to Short Hills, not to Millburn Twp around it. */
function pointInRing(lat, lon, ring){
  let inside = false;
  for (let i=0, j=ring.length-1; i<ring.length; j=i++){
    const xi=ring[i][0], yi=ring[i][1], xj=ring[j][0], yj=ring[j][1];  // [lon,lat]
    if (((yi>lat)!==(yj>lat)) && (lon < (xj-xi)*(lat-yi)/(yj-yi)+xi)) inside=!inside;
  }
  return inside;
}
// bbox area proxy — cheap, only used to order candidates smallest-first
function bboxArea(f){
  const r = f.geometry.coordinates[0];
  let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;
  for (const [x,y] of r){ if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y; }
  return (x1-x0)*(y1-y0);
}
// a Polygon's first ring is the outer boundary; the rest are HOLES. A point is inside
// only if it's in the outer ring and NOT in any hole — that's what makes Metuchen
// (a hole inside Edison) resolve to Metuchen, not Edison.
function inPolygon(lat, lon, coords){
  if (!pointInRing(lat, lon, coords[0])) return false;
  for (let h=1; h<coords.length; h++) if (pointInRing(lat, lon, coords[h])) return false;
  return true;
}
let _ORDER = null;
function orderedFeatures(){
  if (_ORDER) return _ORDER;
  // CDP (sections) first, then SMALLEST polygon first — so an enclosed town (Metuchen,
  // Morristown) beats the township that surrounds it.
  _ORDER = [...M.boundaries.features].sort((a,b)=>{
    const k = (a.properties.kind==="cdp"?0:1)-(b.properties.kind==="cdp"?0:1);
    return k || bboxArea(a)-bboxArea(b);
  });
  return _ORDER;
}
function townAt(lat, lon){
  for (const f of orderedFeatures())
    if (inPolygon(lat, lon, f.geometry.coordinates)) return f.properties.town;
  return null;   // outside every polygon
}
// honest last resort when the point is in no polygon (e.g. near a CDP edge): the NEAREST
// town, clearly labelled as "nearest", never presented as "you are in".
function nearestTown(lat, lon){
  let best=null, bd=Infinity;
  for (const f of M.boundaries.features){
    const r=f.geometry.coordinates[0];
    let cx=0,cy=0; for(const [x,y] of r){cx+=x;cy+=y;} cx/=r.length; cy/=r.length;
    const d=(cx-lon)**2+(cy-lat)**2;
    if(d<bd){bd=d; best=f.properties.town;}
  }
  return best;
}
let meMarker = null;
$("locate").addEventListener("click", ()=>{
  if (!navigator.geolocation){ $("locate").textContent="◎ no geolocation"; return; }
  $("locate").textContent = "◎ locating…";
  navigator.geolocation.getCurrentPosition(pos=>{
    const {latitude:lat, longitude:lon} = pos.coords;
    $("locate").textContent = "◎ Where am I";
    if (meMarker) meMarker.remove();
    meMarker = L.circleMarker([lat,lon], {radius:8, color:"#8c2f2a", weight:3,
      fillColor:"#8c2f2a", fillOpacity:.4}).addTo(map);
    map.setView([lat,lon], 13);
    const town = townAt(lat, lon);
    if (town) showTown(town);
    else {
      // in no polygon — offer the NEAREST town, honestly labelled, not a false "you are in"
      const near = nearestTown(lat, lon);
      if (near){ showTown(near); $("card-sub").textContent = "nearest town — you're just outside its mapped boundary"; }
      else {
        $("card-town").textContent = "Not in a tracked town";
        $("card-sub").textContent = `${lat.toFixed(3)}, ${lon.toFixed(3)} — outside the 63 towns here.`;
        $("card-grid").innerHTML=""; $("card-also").innerHTML="";
        $("card").classList.add("on");
      }
    }
  }, err=>{
    // permission denied or no signal — say so, don't silently do nothing (the car reality)
    $("locate").textContent = "◎ Where am I";
    $("card-town").textContent = "Location unavailable";
    $("card-sub").textContent = err.code===1
      ? "Location permission was denied. Tap a town on the map instead."
      : "Couldn't get a fix (no signal?). Tap a town on the map instead.";
    $("card-grid").innerHTML=""; $("card-also").innerHTML="";
    $("card").classList.add("on");
  }, {enableHighAccuracy:true, timeout:10000, maximumAge:30000});
});

// BUILD tag — bump this string every deploy. If you don't see it, you're on a cached page.
const BUILD = "b07-18n";   // keep the map.js?v= query above in sync when you bump this
$("stamp").textContent = `${M.points.length} listings · data ${M.generated} · ${BUILD}`;

drawGeo();
drawLegend();
</script>
