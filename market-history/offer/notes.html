<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Walkthroughs — the house hunt</title>
<style>
  :root{
    --paper:#f7f4ee; --paper-2:#efe9de; --rule:#ddd5c7; --rule-2:#c8bda9;
    --ink:#1f1c18; --ink-2:#4a443b; --ink-3:#7d7367; --flag:#a8631c;
    --ok:#2d6a3e; --warn:#a0431f; --cool:#3a5f86;
    --serif:"Iowan Old Style","Hoefler Text","Baskerville","Palatino Linotype",Georgia,serif;
    --sans:"Avenir Next","Seravek","Optima","Gill Sans",Helvetica,sans-serif;
  }
  /* This is the one page you sit and WRITE on, for a long time, often at night — which
     is why the same warm paper that reads fine on the other pages is fatiguing here.
     Dark follows the system by default and is remembered per browser. Kept warm rather
     than blue-black so it still belongs to the same set. */
  :root[data-theme="dark"]{
    --paper:#16150f; --paper-2:#211f18; --rule:#332f25; --rule-2:#4a4436;
    --ink:#e8e1d2; --ink-2:#b5ad9c; --ink-3:#8a8271; --flag:#d59a4e;
    --ok:#7fb188; --warn:#d99175; --cool:#8aa9c9;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#16150f; --paper-2:#211f18; --rule:#332f25; --rule-2:#4a4436;
      --ink:#e8e1d2; --ink-2:#b5ad9c; --ink-3:#8a8271; --flag:#d59a4e;
      --ok:#7fb188; --warn:#d99175; --cool:#8aa9c9;
    }
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:17px;
    line-height:1.5;padding:clamp(1.5rem,5vw,3rem) clamp(1.25rem,5vw,3rem) 5rem}
  .sheet{max-width:52rem;margin:0 auto}
  .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem}
  .home{font-size:.85rem;color:var(--ink-3);text-decoration:none}
  .home:hover{color:var(--flag)}
  #theme{font:inherit;font-size:.8rem;background:none;border:1px solid var(--rule);
    border-radius:999px;padding:.25rem .7rem;color:var(--ink-3);cursor:pointer}
  #theme:hover{color:var(--ink-2);border-color:var(--rule-2)}

  /* filters — same chip language as favourites.html */
  .filters{display:flex;gap:.4rem;flex-wrap:wrap;margin:1.4rem 0 .2rem}
  .filters button{font:inherit;font-size:.82rem;border:1px solid var(--rule);background:none;
    color:var(--ink-2);padding:.3rem .7rem;border-radius:999px;cursor:pointer}
  .filters button:hover{border-color:var(--rule-2)}
  .filters button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  .filters .n{opacity:.55;font-size:.8em;margin-left:.25rem}

  /* one row per visit you logged, because you can see a house more than once */
  .visit-row{display:flex;gap:.5rem;align-items:center;font-size:.82rem;color:var(--ink-3);margin-top:.3rem}
  .visit-row .kind{color:var(--ink-2)}
  .visit-row input{font:inherit;font-size:.8rem;border:0;border-bottom:1px solid var(--rule);
    padding:.1rem;background:none;color:var(--ink-2);color-scheme:light dark}
  .visit-row .drop{background:none;border:0;color:var(--ink-3);cursor:pointer;font-size:.95rem;padding:0 .2rem}
  .visit-row .drop:hover{color:var(--warn)}
  h1{font-family:var(--serif);font-weight:400;font-size:clamp(1.8rem,5vw,2.5rem);letter-spacing:-.02em;line-height:1.1}
  .lede{margin-top:.6rem;color:var(--ink-2);font-size:.97rem;max-width:42rem}
  .banner{margin-top:1.2rem;padding:.75rem .9rem;border-left:3px solid var(--rule-2);
    background:var(--paper-2);font-size:.88rem;color:var(--ink-2)}
  h2{font-family:var(--serif);font-weight:400;font-size:1.4rem;margin:2.4rem 0 .3rem}
  .sub{color:var(--ink-3);font-size:.85rem;margin-bottom:.8rem}
  .none{color:var(--ink-3);font-size:.88rem;font-style:italic}

  /* No cards. This page was the only one in the set using white blocks on warm paper,
     seven of them, each holding five pills, three uppercase labels and three bordered
     boxes — about thirteen rectangles per house, all vibrating against the background.
     It now uses the same hairline-rule rhythm as every other page here, and the writing
     area is a sheet of paper rather than a form field. */
  .house{border-bottom:1px solid var(--rule);padding:1.6rem 0}
  .house:first-child{border-top:1px solid var(--rule)}
  .house header{display:flex;justify-content:space-between;align-items:baseline;gap:1rem;flex-wrap:wrap}
  .addr{font-family:var(--serif);font-size:1.35rem;line-height:1.2}
  .addr a{color:inherit;text-decoration:none}
  .addr a:hover{color:var(--flag)}
  .price{font-variant-numeric:tabular-nums;color:var(--ink-2);font-size:.95rem}
  .where{color:var(--ink-3);font-size:.85rem;margin-top:.15rem}
  .tag{display:inline-block;font-size:.7rem;letter-spacing:.02em;text-transform:uppercase;
    padding:.1rem .4rem;border-radius:3px;margin-left:.4rem;vertical-align:.15em}
  .tag{background:var(--paper-2)}
  .t-for_sale{color:var(--ok)}
  .t-pending,.t-contingent{color:var(--flag)}
  .t-sold{color:var(--cool)}
  .t-off,.t-unstarred{color:var(--ink-3)}

  /* the visit row: text, not buttons, until you hover one */
  .seen{display:flex;gap:.9rem;flex-wrap:wrap;margin:.7rem 0 .1rem}
  .seen button{font:inherit;font-size:.82rem;border:0;background:none;padding:0;
    color:var(--ink-3);cursor:pointer;border-bottom:1px solid transparent}
  .seen button:hover{color:var(--ink-2);border-bottom-color:var(--rule-2)}
  .seen button[aria-pressed="true"]{color:var(--ink);font-weight:600;border-bottom-color:var(--flag)}
  .when{font-size:.8rem;color:var(--ink-3);margin-top:.3rem}
  .when input{font:inherit;font-size:.8rem;border:0;border-bottom:1px solid var(--rule);
    padding:.1rem .1rem;background:none;color:var(--ink-2)}

  textarea{width:100%;font:inherit;font-size:1rem;line-height:1.6;margin-top:.8rem;
    padding:.2rem 0;border:0;background:none;color:var(--ink);resize:none;overflow:hidden;
    min-height:2.2rem}
  textarea::placeholder{color:var(--rule-2)}
  textarea:focus{outline:0}
  .saved{font-size:.76rem;color:var(--ink-3);margin-top:.5rem;opacity:0;transition:opacity .25s}
  .saved.on{opacity:1}
  footer{margin-top:2.5rem;color:var(--ink-3);font-size:.85rem;line-height:1.6}
  code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.85em;
    background:var(--paper-2);padding:.1rem .3rem;border-radius:3px}
</style>
</head>
<body>
<div class="sheet">
  <div class="topbar">
    <a class="home" href="index.html">← all tools</a>
    <button type="button" id="theme" aria-label="Switch between light and dark">◑ theme</button>
  </div>
  <h1>Walkthroughs</h1>
  <p class="lede">What you thought when you stood in it. Houses blur after the fourth one —
    this is where the reason you liked or didn't like each of them stays put, including the
    ones that got away.</p>

  <div class="banner" id="banner"></div>

  <h2>Houses</h2>
  <div class="filters" id="filters"></div>
  <p class="sub" id="sub-houses"></p>
  <div id="list"></div>

  <footer id="fine"></footer>
</div>

<script src="listings.js"></script>
<script src="sold.js"></script>
<script src="favourites.js"></script>
<script>
"use strict";
const $ = id => document.getElementById(id);
const usd = n => n == null ? "—" : "$" + Math.round(n).toLocaleString();
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const today = () => new Date().toISOString().slice(0, 10);

/* How you saw it. "Visited" was too vague to record: standing in a house for forty
   minutes and slowing down outside it are different kinds of knowledge, and later you
   will want to know which one a note came from. */
const SEEN = [
  {k: "drive_by",        label: "Drove by"},
  {k: "open_house",      label: "Open house"},
  {k: "private_showing", label: "Private showing"},
  {k: "second_visit",    label: "Went back"},
];
const SEEN_LABEL = Object.fromEntries(SEEN.map(s => [s.k, s.label]));

/* You can see one house several ways -- drove past it in June, open house in August,
   went back with the inspector in September -- and later you will want to know which
   visit a thought came from. So visits are a LIST, and each one's date is optional:
   being made to supply a date is exactly the friction that stops you logging it.
   `visit` (singular) was the old shape and is read once, then written back as a list. */
function visitsOf(n) {
  if (!n) return [];
  if (Array.isArray(n.visits)) return n.visits;
  if (n.visit && n.visit.kind) return [n.visit];
  return [];
}

const norm = s => (s || "").trim().toLowerCase().replace(/\s+/g, " ");

/* Same rule as favourites.html: a live listing beats an old sale, because our sold
   window is three years and plenty of listed houses also closed inside it. */
function resolve(h) {
  const key = (h.key || "").toLowerCase();
  const same = (addr, town) => FAVS.keyFor(addr, h.zip).toLowerCase() === key ||
    (norm(addr) === norm(h.address) && norm(town) === norm(h.town));
  const prior = (window.SOLD && SOLD.rows || []).filter(r => same(r[0], r[1]))
    .sort((a, b) => (b[2] || "").localeCompare(a[2] || ""))[0];
  const live = (window.MARKET && MARKET.listings || []).filter(l => same(l.a, l.t))[0];
  if (live) {
    const st = (live.st || "FOR_SALE").toLowerCase();
    return {stage: st === "for_sale" ? "for_sale" : st, price: live.p, url: live.url,
            beds: live.bd, baths: live.ba, sqft: live.sq};
  }
  if (prior) return {stage: "sold", price: prior[3], when: prior[2], url: null,
                     beds: prior[4], baths: prior[5], sqft: prior[6]};
  return {stage: "off", price: null, url: null};
}

/* Every house worth showing: the current shortlist, PLUS anything with notes on it even
   if it is no longer starred. That second half is the point of a separate notes file. */
function houses() {
  const out = new Map();
  for (const f of FAVS.all())
    out.set((f.key || "").toLowerCase(),
            {key: f.key, address: f.address, town: f.town, zip: f.zip, starred: true});
  for (const [k, n] of Object.entries(NOTES.all())) {
    if (out.has(k)) continue;
    out.set(k, {key: k, address: n.address || k, town: n.town, zip: n.zip, starred: false});
  }
  return [...out.values()];
}

/* One debounce timer PER HOUSE, but the pending edits ACCUMULATE. Replacing them lost
   data when two fields on the same house changed inside half a second -- the second call
   cancelled the first timer and only the later field was sent. Still true for the note
   and the visit date. */
/* The same stages favourites.html filters by, plus the two questions this page is for:
   have I been, and have I written it down. */
const STAGES = [
  {k: "all",        label: "All"},
  {k: "for_sale",   label: "For sale"},
  {k: "pending",    label: "Pending"},
  {k: "contingent", label: "Contingent"},
  {k: "sold",       label: "Sold"},
  {k: "off",        label: "Off market"},
  {k: "seen",       label: "Seen in person"},
  {k: "written",    label: "Has notes"},
  {k: "blank",      label: "Nothing written"},
];
let filter = "all";
const matches = (h, L) => {
  const n = NOTES.get(h.key) || {};
  switch (filter) {
    case "all":     return true;
    case "seen":    return visitsOf(n).length > 0;
    case "written": return !!(n.note || "").trim();
    case "blank":   return !(n.note || "").trim();
    default:        return L.stage === filter;
  }
};

const timers = {}, pending = {};
const flash = el => { el.classList.add("on"); setTimeout(() => el.classList.remove("on"), 1200); };

function render() {
  const all = houses(), ro = !NOTES.writable();
  const stageOf = {};
  for (const h of all) stageOf[h.key] = resolve(h);

  // counts on every chip, so an empty filter is visible before you click it
  const count = k => { const was = filter; filter = k;
    const n = all.filter(h => matches(h, stageOf[h.key])).length; filter = was; return n; };
  $("filters").innerHTML = STAGES.map(f =>
    `<button type="button" data-k="${f.k}" aria-pressed="${filter === f.k}">${f.label}<span class="n">${count(f.k)}</span></button>`).join("");
  document.querySelectorAll("#filters button").forEach(b =>
    b.addEventListener("click", () => { filter = b.dataset.k; render(); }));

  const hs = all.filter(h => matches(h, stageOf[h.key]));
  const seen = all.filter(h => visitsOf(NOTES.get(h.key)).length).length;
  const written = all.filter(h => ((NOTES.get(h.key) || {}).note || "").trim()).length;
  $("sub-houses").textContent = all.length
    ? `${hs.length} of ${all.length} · ${seen} seen in person · ${written} written up` : "";

  if (!all.length) {
    $("list").innerHTML = `<p class="none">Nothing yet — star a house on
      <a href="market.html">What's for sale</a> and it shows up here.</p>`;
    return;
  }
  if (!hs.length) { $("list").innerHTML = `<p class="none">No houses match that filter.</p>`; return; }

  $("list").innerHTML = hs.map(h => {
    const L = stageOf[h.key], n = NOTES.get(h.key) || {}, k = esc(h.key);
    const label = L.stage === "off" ? "off market" : L.stage.replace("_", " ");
    const facts = [L.beds != null ? `${L.beds}bd` : null, L.baths != null ? `${L.baths}ba` : null,
                   L.sqft ? L.sqft.toLocaleString() + " sqft" : null].filter(Boolean).join(" · ");
    const vs = visitsOf(n);
    const on = new Set(vs.map(v => v.kind));
    return `<div class="house" data-key="${k}">
      <header>
        <div><div class="addr">${L.url ? `<a href="${esc(L.url)}" target="_blank" rel="noopener">${esc(h.address)}</a>` : esc(h.address)}<span class="tag t-${L.stage}">${esc(label)}</span>${
          h.starred ? "" : '<span class="tag t-unstarred">not starred</span>'}</div>
          <div class="where">${esc(h.town || "")}${facts ? " · " + facts : ""}${
            L.stage === "sold" && L.when ? ` · closed ${esc(L.when)}` : ""}</div></div>
        <div class="price">${usd(L.price)}</div>
      </header>
      <div class="seen" role="group" aria-label="How you saw it">
        ${SEEN.map(v => `<button type="button" data-kind="${v.k}" aria-pressed="${on.has(v.k)}"${ro ? " disabled" : ""}>${v.label}</button>`).join("")}
      </div>
      ${vs.map((v, i) => `<div class="visit-row" data-i="${i}">
          <span class="kind">${esc(SEEN_LABEL[v.kind] || v.kind)}</span>
          <input type="date" class="visit-date" value="${esc(v.date || "")}"${ro ? " disabled" : ""}>
          ${v.date ? "" : '<span>no date</span>'}
          ${ro ? "" : '<button type="button" class="drop" title="Remove this visit">×</button>'}
        </div>`).join("")}
      <textarea class="note" rows="1" placeholder="What did you think?"${ro ? " disabled" : ""}>${esc(n.note || "")}</textarea>
      <div class="saved" data-saved>${n.updated ? `saved ${esc(n.updated)}` : ""}</div>
    </div>`;
  }).join("");

  if (ro) return;

  /* Grow the box to fit what is in it — a fixed-height field with a scrollbar is the
     thing that makes people stop writing. */
  const grow = t => { t.style.height = "auto"; t.style.height = t.scrollHeight + "px"; };
  document.querySelectorAll(".house").forEach(el => {
    const key = el.dataset.key;
    const h = hs.find(x => (x.key || "").toLowerCase() === key.toLowerCase()) || {};
    const who = {address: h.address, town: h.town, zip: h.zip};
    const mark = el.querySelector("[data-saved]");
    const push = fields => {
      pending[key] = {...(pending[key] || {}), ...fields};
      clearTimeout(timers[key]);
      timers[key] = setTimeout(async () => {
        const batch = pending[key]; delete pending[key];
        await NOTES.save(key, who, batch);
        mark.textContent = "saved"; flash(mark);
      }, 600);
    };
    const saveVisits = async list => {
      await NOTES.save(key, who, {visits: list, visit: null});
      render();
    };

    el.querySelectorAll(".seen button").forEach(b => b.addEventListener("click", async () => {
      const kind = b.dataset.kind, vs = visitsOf(NOTES.get(key)).slice();
      const at = vs.findIndex(v => v.kind === kind);
      // date starts EMPTY on purpose: having to supply one is the friction that stops
      // you logging the visit at all. Fill it in later, or never.
      if (at >= 0) vs.splice(at, 1); else vs.push({kind, date: ""});
      await saveVisits(vs);
    }));
    el.querySelectorAll(".visit-row").forEach(row => {
      const i = +row.dataset.i;
      row.querySelector(".visit-date").addEventListener("change", async e => {
        const vs = visitsOf(NOTES.get(key)).slice();
        if (vs[i]) { vs[i] = {...vs[i], date: e.target.value}; await saveVisits(vs); }
      });
      const drop = row.querySelector(".drop");
      if (drop) drop.addEventListener("click", async () => {
        const vs = visitsOf(NOTES.get(key)).slice();
        vs.splice(i, 1); await saveVisits(vs);
      });
    });

    const t = el.querySelector(".note");
    grow(t);
    t.addEventListener("input", e => { grow(e.target); push({note: e.target.value}); });
  });
}

/* Theme: follow the system unless you have said otherwise on this browser. Wrapped,
   because storage throws in a private window and the page must still render. */
(function theme() {
  const KEY = "notes.theme";
  let saved = null;
  try { saved = localStorage.getItem(KEY); } catch (e) {}
  if (saved) document.documentElement.setAttribute("data-theme", saved);
  $("theme").addEventListener("click", () => {
    const dark = getComputedStyle(document.documentElement)
      .getPropertyValue("--paper").trim().toLowerCase().startsWith("#1");
    const next = dark ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    try { localStorage.setItem(KEY, next); } catch (e) {}
  });
})();

Promise.all([FAVS.load(), NOTES.load()]).then(() => {
  $("banner").innerHTML = NOTES.writable()
    ? `<b>Writable.</b> Everything saves into <code>offer/notes.json</code> as you type.
       Commit it and your notes follow you anywhere.`
    : `<b>Read-only.</b> This is the published copy — read your notes here, but run
       <code>python3 offer/serve.py</code> on the laptop to change them.`;
  $("fine").innerHTML = `<p><b>Notes are their own file.</b> <code>notes.json</code> is keyed by
     house, separate from <code>favourites.json</code>, so un-starring a house does not throw
     away what you learned in it. A house that sold to someone else still appears here, marked
     <i>not starred</i> — often that is the most useful note you have, because you know how the
     story ended.</p>
     <p>Write however you want. Making sense of it — pulling out what you keep saying across
     houses — is a job for later, not a form to fill in now.</p>`;
  render();
});
</script>
</body>
</html>
